name: Danny
options:
  bundleIdPrefix: app.danny
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Danny:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/bin
        type: folder
        buildPhase: resources
    info:
      path: Sources/Support/Info.plist
      properties:
        CFBundleDisplayName: Danny
        CFBundleName: Danny
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: MIT License. Danny is not affiliated with YouTube, X, or Instagram.
        LSMinimumSystemVersion: "26.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticGraphicsSwitching: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.danny.desktop
        PRODUCT_NAME: Danny
        # `make version V=x.y.z` sets this; releases set the build number from git.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_LSUIElement: NO

  DannyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DannyTests
    dependencies:
      - target: Danny
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.danny.desktop.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Danny:
    build:
      targets:
        Danny: all
        DannyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DannyTests
