name: CI

# Public repo: macOS runners are free, so every PR gets lint + tests.
# Docs-only changes skip the macOS job. PR titles are checked in pr-title.yml,
# which is the only workflow that runs when a PR is edited.
on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  check:
    name: Lint and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install xcodegen swiftformat swiftlint xcbeautify
      - name: Metal toolchain
        run: xcrun -f metal > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Lint
        run: make lint
      - name: Test
        run: make test
