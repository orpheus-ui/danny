# git-cliff — builds CHANGELOG.md and release notes from Conventional Commit
# titles (squash-merged PR titles). `make changelog` and scripts/release.sh use it.

[changelog]
header = """
# Changelog

What changed in each Danny release. Generated from pull request titles by
[git-cliff](https://git-cliff.org) — see cliff.toml.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} (**breaking**){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "newest"
# What users care about. Tooling, CI, docs and style changes stay out of the notes.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster and lighter" },
  { message = "^security", group = "<!-- 3 -->Security" },
  { message = "^refactor", group = "<!-- 4 -->Under the hood" },
  { message = "^(chore|ci|build|style|test|docs|release)", skip = true },
]
