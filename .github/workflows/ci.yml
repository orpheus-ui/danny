name: CI

# Public repo: macOS runners are free, so every PR gets lint + tests.
# Docs-only changes skip the macOS job.
on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|refactor|perf|chore|docs|test|ci|build|style|security)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::PR title must be a Conventional Commit, e.g. 'feat(ui): rebuild the progress bar'"; exit 1; }

  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  check:
    name: Lint and test
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event.action != 'edited'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install xcodegen swiftformat swiftlint xcbeautify
      - name: Lint
        run: make lint
      - name: Test
        run: make test
