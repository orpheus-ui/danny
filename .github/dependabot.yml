# Keeps the GitHub Actions used by CI and releases current. Swift has no
# package dependencies yet; yt-dlp and ffmpeg are pinned by hand in
# scripts/fetch-dependencies.sh (ADR-012).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
