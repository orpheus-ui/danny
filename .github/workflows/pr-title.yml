name: PR title

# PRs are squash-merged, so the title becomes the commit and the changelog line
# and must be a Conventional Commit. This lives apart from CI so that editing a
# PR (title, description, a bot's summary) re-checks the title and nothing else:
# an edit that re-ran CI reported the tests as skipped, which counts as passing
# for a required check, and cancelled a test run still in progress.
on:
  pull_request:
    branches: [development, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|refactor|perf|chore|docs|test|ci|build|style|security)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::PR title must be a Conventional Commit, e.g. 'feat(ui): rebuild the progress bar'"; exit 1; }
